<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>A Kingdom by the Sea</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Shockwave-style loading screen -->
  <div id="loader" role="status" aria-live="polite">
    <p class="loader-title">A Kingdom by the Sea</p>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <p class="loader-pct" id="pct">Loading… 0%</p>
  </div>

  <main id="stage" hidden>
    <canvas id="scene" width="800" height="500" aria-label="A moonlit shore with a sepulchre by the sea"></canvas>

    <!-- Invisible-but-focusable hotspots layered over the canvas (keyboard + screen reader friendly) -->
    <button class="hotspot" data-spot="moon"      style="left:72%;top:10%;width:14%;height:20%">The moon</button>
    <button class="hotspot" data-spot="stars"     style="left:8%;top:4%;width:40%;height:22%">The stars</button>
    <button class="hotspot" data-spot="sea"       style="left:0%;top:62%;width:100%;height:38%">The sea</button>
    <button class="hotspot" data-spot="sepulchre" style="left:40%;top:38%;width:20%;height:26%">The sepulchre</button>

    <section id="dialogue" aria-live="polite">
      <p id="stanza" class="stanza"></p>
      <p id="ghost" class="ghost">Touch the night. Something here remembers.</p>
      <form id="candle" hidden>
        <label for="name">Light a candle for someone you loved:</label>
        <input id="name" maxlength="60" autocomplete="off" placeholder="a name…" />
        <button type="submit">🕯️ Light</button>
        <small>The name is spoken once to a model on this computer and never saved.</small>
      </form>
    </section>
    <label class="quiet"><input type="checkbox" id="quiet" /> Quiet mode (no motion)</label>
  </main>

  <script src="app.js"></script>
</body>
</html>
